services:
  - type: web
    name: tcg-the-cruise-god
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: SUPABASE_URL
        value: "https://vwxhxygaijvdthahjwec.supabase.co"
      - key: CRUISEHQ_BASE_URL
        value: "https://cruisehq.fun"
      - key: PROJECT_ID
        sync: false
      - key: PROJECT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
